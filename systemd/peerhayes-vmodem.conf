# Answering PeerHayes for 2:203/910.
# serial is /dev/tnt1. mgetty and qico hold /dev/tnt0. tty0tty crosses
# DTR to DCD, so qico's carrier check follows this modem's DTR.
# listen is the TCP port a calling PeerHayes dials.
# auto_answer stays 0: mgetty sends ATA.

[modem]
name = node-910
serial = /dev/tnt1
baudrate = 57600
modem_speed = 57600
auto_answer = 0

[network]
listen = 0.0.0.0:5000
